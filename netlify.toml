[build]
  base = "frontend"
  publish = "build"
  command = "CI=false npm run build"

[build.environment]
  NODE_VERSION = "20"
  PYTHON_VERSION = "3.12"

# Редиректы для SPA (React)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers для безопасности
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Переменные окружения (заполняются в UI Netlify)
[template.environment]
  KIETEST = "API ключ для бэкенда"
  DATABASE_URL = "PostgreSQL строка подключения"

# Serverless functions (если понадобятся)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Dev-сервер (локальная разработка)
[dev]
  command = "npm run start"
  port = 8888
  publish = "build"
  target_port = 3000