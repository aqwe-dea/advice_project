[build]
  command = "npm run build"
  publish = "./public"
  build = "./build"
  base_directory = "./frontend"
  functions = "./netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "./*"
  to = "./index.html"
  status = 200

[template.environment]
  KIETEST = "API ключ для бэкенда"
  DATABASE_URL = "PostgreSQL строка подключения"