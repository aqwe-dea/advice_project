version: '3.8'

services:
  # Наш основной бэкенд с 15 агентами
  backend:
    build: .
    container_name: aqwe_platform_backend
    ports:
      - "8000:8000" # Пробрасываем порт 8000 из контейнера на компьютер
    env_file:
      - .env # Файл с твоими секретами (KIETEST и т.д.)
    environment:
      - DEBUG=0
      - ALLOWED_HOSTS=*
    volumes:
      # Монтируем папку с базой данных или медиафайлами, чтобы они сохранялись
      - ./media:/app/media
      - ./logs:/app/logs
    restart: unless-stopped # Автоматический перезапуск при сбое

  # (Опционально) Если в будущем добавим базу данных PostgreSQL
  # db:
